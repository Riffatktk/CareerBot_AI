[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

; The actual URL is set programmatically in alembic/env.py from the same
; DATABASE_URL environment variable the app itself reads (see database.py).
; This value is only a fallback.
sqlalchemy.url = sqlite+aiosqlite:///./careerbot.db

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
